name: Deploy Docs
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npx astro build
      - name: Verify build output
        run: |
          set -e
          echo "Checking critical pages..."
          test -f dist/index.html && echo "  ✓ index.html"
          test -f dist/overview/index.html && echo "  ✓ overview/index.html"
          test -f dist/installation/index.html && echo "  ✓ installation/index.html"
          test -f dist/quick-start/index.html && echo "  ✓ quick-start/index.html"
          test -f dist/reference/commands/index.html && echo "  ✓ commands/index.html"
          test -f dist/404.html && echo "  ✓ 404.html"
          test -f dist/pagefind/pagefind.js && echo "  ✓ search index"
          echo "All pages present. Build validated."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
