<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Data layer 1 -->
  <rect x="90" y="160" width="280" height="44" rx="12" fill="white"/>
  
  <!-- Data layer 2 (offset right, showing iteration) -->
  <rect x="130" y="260" width="280" height="44" rx="12" fill="white"/>
  
  <!-- Branch line from layer 2 to snapshot -->
  <line x1="410" y1="282" x2="430" y2="235" stroke="white" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Snapshot/version circle -->
  <circle cx="430" cy="210" r="32" fill="none" stroke="white" stroke-width="10"/>
  
  <!-- Checkmark inside snapshot -->
  <polyline points="415,210 425,222 445,198" fill="none" stroke="#93c5fd" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
