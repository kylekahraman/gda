<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Three connected nodes (hexagons) -->
  <polygon points="20,50 20,35 35,27 50,35 50,50 35,58" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="35,58 35,43 50,35 65,43 65,58 50,66" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  <line x1="35" y1="39" x2="35" y2="54" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- G letter -->
  <text x="50" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="white">g</text>
</svg>
