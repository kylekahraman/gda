<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Content-addressed chain icon: three connected hexagons -->
  <!-- Left hexagon -->
  <polygon points="120,320 120,220 200,170 280,220 280,320 200,370" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/>
  <!-- Center hexagon (slightly lower - the 'current state') -->
  <polygon points="200,380 200,280 280,230 360,280 360,380 280,430" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/>
  <!-- Right hexagon -->
  <polygon points="280,290 280,190 360,140 440,190 440,290 360,340" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/>
  <!-- Connecting links -->
  <line x1="200" y1="195" x2="200" y2="355" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="255" x2="280" y2="365" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- G letter in the center hexagon -->
  <text x="280" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="64" fill="white">g</text>
</svg>
